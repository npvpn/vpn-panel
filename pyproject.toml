[project]
name = "marzban-panel"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "APScheduler==3.9.1.post1",
    "setuptools==80.9.0",
    "Deprecated==1.2.13",
    "Jinja2==3.1.4",
    "MarkupSafe==2.1.1",
    "PyJWT==2.8.0",
    "PyMySQL==1.1.1",
    "PyYAML==6.0.2",
    "SQLAlchemy==2.0.36",
    "alembic==1.14.0",
    "anyio==4.2.0",
    "argon2-cffi==23.1.0",
    "bcrypt==4.0.1",
    "certifi==2024.07.04",
    "cffi==1.17.1",
    "click==8.1.7",
    "commentjson==0.9.0",
    "cryptography==43.0.1",
    "fastapi==0.115.2",
    "grpcio-tools==1.67.1",
    "grpcio==1.67.1",
    "httptools==0.6.4",
    "jdatetime==4.1.1",
    "passlib==1.7.4",
    "psutil==5.9.4",
    "pyOpenSSL==24.2.1",
    "PySocks==1.7.1",
    "pyTelegramBotAPI==4.9.0",
    "pydantic==2.10.4",
    "python-dateutil==2.8.2",
    "python-decouple==3.6",
    "python-dotenv==0.21.1",
    "python-multipart==0.0.7",
    "qrcode==7.4.2",
    "requests==2.32.3",
    "rich==13.7.1",
    "rpyc==6.0.0",
    "rsa==4.9",
    "sniffio==1.3.0",
    "starlette==0.40.0",
    "typer==0.7.0",
    "urllib3==1.26.19",
    "uvicorn==0.27.0.post1",
    "websocket-client==1.7.0",
    "websockets==12.0",
    "prometheus-fastapi-instrumentator==7.0.2",
]

[dependency-groups]
dev = [
    "ruff>=0.15.6",
    "pre-commit>=4.5.1",
    "mypy>=1.15",
    "mypy-baseline>=0.7",
    "types-requests<2.32",
    "types-PyYAML>=6.0",
    "types-python-dateutil>=2.8",
]
test = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
check_untyped_defs = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
no_implicit_optional = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
ignore_missing_imports = false
follow_imports = "normal"
exclude = ["app/db/migrations/"]

# Сторонние библиотеки без типов/стабов
[[tool.mypy.overrides]]
module = [
    "commentjson.*",
    "rpyc.*",
    "telebot.*",
    "jdatetime.*",
    "decouple.*",
    "grpc.*",
    "xray_api.*",
    "apscheduler.*",
    "prometheus_fastapi_instrumentator.*",
    "psutil.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [
    "app/db/migrations",
    "app/dashboard/build",
    "xray_api",
    "marzban-cli.py",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]
ignore = [
    "E402",  # import not at top — намеренно в __init__.py (условные импорты) — расшиваем итеративно
    "E501",  # длинные строки — за это отвечает форматтер
    "E711",  # сравнение с None — нужно для фильтров SQLAlchemy
    "E712",  # сравнение с True/False — нужно для фильтров SQLAlchemy
    "E722",  # bare except — расшиваем итеративно (см. ruff-strict.toml)
    "F403",  # star import — расшиваем итеративно
    "F405",  # may be from star import — расшиваем итеративно
    "F811",  # переопределение имени — расшиваем итеративно
    "F841",  # неиспользуемая локальная — расшиваем итеративно
    "UP031", # printf-format — расшиваем итеративно
    "UP042", # str+Enum → StrEnum — расшиваем итеративно
    "UP047", # non-pep695-generic — расшиваем итеративно
    "W291",  # trailing whitespace in strings — расшиваем итеративно
]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.isort]
known-first-party = ["app", "config", "main"]

[tool.ruff.lint.per-file-ignores]
# typer 0.7.0 не понимает PEP 604 (`X | None`) и PEP 585 (`list[...]`) в аннотациях
# CLI-параметров — оставляем typing.Optional/List, иначе marzban-cli падает на старте.
"cli/*" = ["UP006", "UP007", "UP035", "UP045"]

[project]
name = "marzban-panel"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "APScheduler==3.11.3",
    "setuptools==84.2.1",
    "Deprecated==3.0.1",
    "Jinja2==3.1.6",
    "MarkupSafe==3.0.4",
    "PyJWT==2.15.1",
    "PyMySQL==1.2.4",
    "PyYAML==6.0.3",
    "SQLAlchemy==2.1.9",
    "alembic==1.20.1",
    "anyio==4.16.0",
    "argon2-cffi==25.1.0",
    # Passlib 1.7.4 backend self-test fails with bcrypt 5 (72-byte limit).
    "bcrypt==4.3.0",
    "certifi==2026.10.23",
    "cffi==2.1.1",
    "click==8.5.1",
    "commentjson==0.9.0",
    "cryptography==50.0.2",
    "fastapi==0.164.0",
    "grpcio-tools==1.85.3",
    "grpcio==1.85.3",
    "httptools==0.9.0",
    "jdatetime==6.1.1",
    "passlib==1.7.4",
    "psutil==7.2.2",
    "pyOpenSSL==26.4.0",
    "PySocks==1.7.1",
    "pyTelegramBotAPI==4.37.1",
    "pydantic==2.14.3",
    "python-dateutil==4.0.0",
    "python-decouple==3.8",
    "python-dotenv==1.2.4",
    "python-multipart==0.0.34",
    "qrcode==8.2",
    "requests==2.34.2",
    "rich==15.0.0",
    "rpyc==6.0.2",
    "rsa==4.9.1",
    "sniffio==1.3.1",
    "starlette==1.10.0",
    "typer==0.29.2",
    "urllib3==2.8.0",
    "uvicorn==0.54.0",
    "websocket-client==1.9.2",
    "websockets==17.4",
    "prometheus-fastapi-instrumentator==8.1.0",
    "regex>=2026.11.18",
]

[dependency-groups]
dev = [
    "ruff>=0.15.6",
    "pre-commit>=4.5.1",
    "mypy>=1.15",
    "mypy-baseline>=0.7",
    "types-requests<2.32",
    "types-PyYAML>=6.0",
    "types-python-dateutil>=2.8",
    "types-regex>=2026.9.29.20261017",
]
test = [
    "httpx>=0.28,<0.29",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
check_untyped_defs = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
no_implicit_optional = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
ignore_missing_imports = false
follow_imports = "normal"
exclude = ["app/db/migrations/"]

# Сторонние библиотеки без типов/стабов
[[tool.mypy.overrides]]
module = [
    "commentjson.*",
    "rpyc.*",
    "telebot.*",
    "jdatetime.*",
    "decouple.*",
    "grpc.*",
    "xray_api.*",
    "apscheduler.*",
    "prometheus_fastapi_instrumentator.*",
    "psutil.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [
    "app/db/migrations",
    "app/dashboard/build",
    "xray_api",
    "marzban-cli.py",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]
ignore = [
    "E402",  # import not at top — намеренно в __init__.py (условные импорты) — расшиваем итеративно
    "E501",  # длинные строки — за это отвечает форматтер
    "E711",  # сравнение с None — нужно для фильтров SQLAlchemy
    "E712",  # сравнение с True/False — нужно для фильтров SQLAlchemy
    "E722",  # bare except — расшиваем итеративно (см. ruff-strict.toml)
    "F403",  # star import — расшиваем итеративно
    "F405",  # may be from star import — расшиваем итеративно
    "F811",  # переопределение имени — расшиваем итеративно
    "F841",  # неиспользуемая локальная — расшиваем итеративно
    "UP031", # printf-format — расшиваем итеративно
    "UP042", # str+Enum → StrEnum — расшиваем итеративно
    "UP047", # non-pep695-generic — расшиваем итеративно
    "W291",  # trailing whitespace in strings — расшиваем итеративно
]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.isort]
known-first-party = ["app", "config", "main"]

[tool.ruff.lint.per-file-ignores]
# typer 0.7.0 не понимает PEP 604 (`X | None`) и PEP 585 (`list[...]`) в аннотациях
# CLI-параметров — оставляем typing.Optional/List, иначе marzban-cli падает на старте.
"cli/*" = ["UP006", "UP007", "UP035", "UP045"]

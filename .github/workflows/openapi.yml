name: OpenAPI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups
      - name: Export OpenAPI schema
        run: uv run python scripts/export_openapi.py openapi.json
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: openapi.json
          if-no-files-found: error

  publish:
    needs: export
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: openapi
      - name: Publish schema on the openapi release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Актуальная схема API ветки master. Файл обновляется при каждом push в master."
          if gh release view openapi >/dev/null 2>&1; then
            gh release upload openapi openapi.json --clobber
          else
            gh release create openapi \
              --target "$GITHUB_SHA" \
              --title "OpenAPI" \
              --notes "$notes" \
              --prerelease \
              --latest=false \
              openapi.json
          fi

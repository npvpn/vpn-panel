name: CI
on:
  pull_request:
  push:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      # Node для тестов, исполняющих фронтовую логику: .ts-модули дашборда
      # (tests/test_hosts_dialog_logic_js.py) Node снимает с типов сам с 22.18.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/dashboard/package-lock.json
      - name: Install dashboard dependencies for form contract tests
        working-directory: app/dashboard
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: uv sync --all-groups
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: strict lint (changed files only)
        # informational на время Фазы 0; после мержа в master убрать continue-on-error (станет блокирующим)
        continue-on-error: true
        run: |
          if [ -f scripts/lint-strict.sh ]; then
            bash scripts/lint-strict.sh origin/${{ github.base_ref || 'master' }}
          fi
      - name: mypy (baseline)
        run: |
          # mypy завершается с кодом 1 при наличии ошибок (их 1000+ в baseline);
          # отключаем pipefail, чтобы итоговый статус определял mypy-baseline filter,
          # а не mypy. filter вернёт ненулевой код только на НОВЫХ ошибках.
          set +o pipefail
          uv run mypy app | uv run mypy-baseline filter
      - name: Install Xray
        # tests/test_export_openapi.py импортирует приложение, а XRayCore
        # при импорте вызывает `xray version`. Без бинарника pytest падает
        # с FileNotFoundError: /usr/local/bin/xray.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl unzip ca-certificates
          version="$(sed -n 's/^ARG XRAY_VERSION=//p' Dockerfile | head -n 1)"
          test -n "$version"
          curl -fsSL https://github.com/npvpn/Marzban-scripts/raw/master/install_latest_xray.sh | sudo bash -s -- "$version"
          xray version
      - name: pytest
        run: uv run pytest -q
